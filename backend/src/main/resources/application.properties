spring.application.name=campus-trade-platform

# 默认本地开发使用的数据库连接，可在 Docker 中通过环境变量覆盖
spring.datasource.url=jdbc:mysql://localhost:3306/campus_trade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.campustrade.entity

# SQL 初始化（schema.sql + data.sql）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Thymeleaf
spring.thymeleaf.cache=false

# 服务器端口：后端接口使用 8000
server.port=8000

# 日志级别
logging.level.root=INFO
logging.level.com.example.campustrade=INFO

