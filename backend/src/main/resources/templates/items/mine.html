<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>我发布的商品 - 校园二手交易平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body class="app-body">
<div class="grid-bg"></div>
<header class="app-header">
    <div class="app-logo">Campus Trade</div>
    <nav class="app-nav">
        <a th:href="@{/items}" href="/items" class="nav-link">商品列表</a>
        <a th:href="@{/items/mine}" href="/items/mine" class="nav-link nav-link-active">我发布的</a>
        <a th:href="@{/items/orders}" href="/items/orders" class="nav-link">我的订单</a>
        <a th:if="${isAdmin}" th:href="@{/admin/users}" href="/admin/users" class="nav-link">管理后台</a>
        <span class="nav-user">
            <span class="nav-username" th:text="${currentUsername}">user</span>
            <span class="badge" th:if="${isAdmin}">ADMIN</span>
            <form action="/logout" method="post" class="inline-form">
                <button type="submit" class="btn btn-secondary btn-sm">退出</button>
            </form>
        </span>
    </nav>
</header>
<main class="app-main">
    <div class="app-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">我发布的商品</h1>
                <p class="page-subtitle">这里展示你发布的所有商品（在售和已成交）。</p>
            </div>
            <a th:if="${!isAdmin}" th:href="@{/items/new}" href="/items/new" class="btn btn-primary btn-glow">发布新商品</a>
            <a th:if="${isAdmin}" th:href="@{/items(adminReadonly='1')}" href="/items?adminReadonly=1" class="btn btn-secondary">
                发布新商品（管理员不可操作）
            </a>
        </div>
        <div class="card card-glass">
            <table class="table">
                <thead>
                <tr>
                    <th>标题</th>
                    <th>价格</th>
                    <th>状态</th>
                    <th>买家</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="6" class="table-empty">你还没有发布商品。</td>
                </tr>
                <tr th:each="item : ${items}">
                    <td>
                        <a th:href="@{'/items/' + ${item.id}}" href="/items/1" class="item-title-link">
                            <span class="item-title" th:text="${item.title}">商品标题</span>
                        </a>
                        <div class="item-desc" th:text="${item.description}">商品描述</div>
                    </td>
                    <td th:text="${#numbers.formatDecimal(item.price, 1, 'POINT', 2, 'POINT')}">99.00</td>
                    <td><span class="badge" th:text="${item.status}">ACTIVE</span></td>
                    <td th:text="${item.buyerId != null ? (item.buyerId + ' - ' + (userNameById[item.buyerId] != null ? userNameById[item.buyerId] : '未知用户')) : '-'}">-</td>
                    <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                    <td class="table-actions">
                        <span th:if="${!isAdmin and !#strings.equalsIgnoreCase(item.status, 'SOLD')}">
                            <a th:href="@{'/items/' + ${item.id} + '/edit'(from='mine',page=${page},size=${size})}" href="/items/1/edit" class="btn btn-secondary btn-sm">编辑</a>
                            <form th:action="@{'/items/' + ${item.id} + '/delete'}" method="post" class="inline-form"
                                  onsubmit="return confirm('确认删除该商品吗？');">
                                <input type="hidden" name="from" value="mine"/>
                                <input type="hidden" name="page" th:value="${page}"/>
                                <input type="hidden" name="size" th:value="${size}"/>
                                <button type="submit" class="btn btn-danger btn-sm">删除</button>
                            </form>
                        </span>
                        <span th:if="${!isAdmin and #strings.equalsIgnoreCase(item.status, 'SOLD')}" class="muted">已卖出不可编辑/删除</span>
                        <span th:if="${isAdmin}" class="muted">管理员只读</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${param.error}" class="alert alert-error" style="margin-top: 12px;">
            操作失败：已卖出商品不可编辑或删除。
        </div>
        <div class="pagination" th:if="${totalPages != null and totalPages > 1}">
            <a class="page-link"
               th:classappend="${page <= 1} ? ' page-link-disabled'"
               th:href="${page > 1} ? @{'/items/mine'(page=${page-1},size=${size})} : '#'"
               href="#">
                上一页
            </a>
            <span class="page-numbers">
                <a th:each="p : ${#numbers.sequence(1, totalPages)}"
                   th:href="@{'/items/mine'(page=${p},size=${size})}"
                   th:text="${p}"
                   th:class="'page-link' + (${p} == ${page} ? ' page-link-active' : '')">1</a>
            </span>
            <a class="page-link"
               th:classappend="${page >= totalPages} ? ' page-link-disabled'"
               th:href="${page < totalPages} ? @{'/items/mine'(page=${page+1},size=${size})} : '#'"
               href="#">
                下一页
            </a>
        </div>
    </div>
</main>
<footer class="app-footer">
    <span>© 2026 Campus Trade · 校园二手交易平台</span>
</footer>
</body>
</html>
