<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>提交评价 - 校园二手交易平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body class="app-body">
<div class="grid-bg"></div>
<header class="app-header">
    <div class="app-logo">Campus Trade</div>
    <nav class="app-nav">
        <a th:href="@{/items}" href="/items" class="nav-link">商品列表</a>
        <a th:href="@{/items/mine}" href="/items/mine" class="nav-link">我发布的</a>
        <a th:href="@{/items/orders}" href="/items/orders" class="nav-link nav-link-active">我的订单</a>
        <a th:if="${isAdmin}" th:href="@{/admin/users}" href="/admin/users" class="nav-link">管理后台</a>
        <span class="nav-user">
            <span class="nav-username" th:text="${currentUsername}">user</span>
            <span class="badge" th:if="${isAdmin}">ADMIN</span>
            <form action="/logout" method="post" class="inline-form">
                <button type="submit" class="btn btn-secondary btn-sm">退出</button>
            </form>
        </span>
    </nav>
</header>
<main class="app-main">
    <div class="app-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">提交评价</h1>
                <p class="page-subtitle">请对您购买的商品进行真实评价。</p>
            </div>
        </div>

        <div class="card card-glass" th:if="${item != null}">
            <div class="review-item-info">
                <h3 th:text="${item.title}">商品标题</h3>
                <p class="text-muted" th:text="${item.description}">商品描述</p>
            </div>
        </div>

        <div class="card card-glass" th:if="${errorMessage != null}">
            <div class="alert alert-danger" th:text="${errorMessage}">错误信息</div>
        </div>

        <div class="card card-glass">
            <form th:action="@{/reviews}" th:object="${review}" method="post" class="review-form">
                <input type="hidden" th:field="*{itemId}"/>

                <div class="form-group">
                    <label class="form-label">评分</label>
                    <div class="star-rating">
                        <label class="star-option">
                            <input type="radio" th:field="*{rating}" value="1"/>
                            <span class="star">★</span>
                        </label>
                        <label class="star-option">
                            <input type="radio" th:field="*{rating}" value="2"/>
                            <span class="star">★★</span>
                        </label>
                        <label class="star-option">
                            <input type="radio" th:field="*{rating}" value="3"/>
                            <span class="star">★★★</span>
                        </label>
                        <label class="star-option">
                            <input type="radio" th:field="*{rating}" value="4"/>
                            <span class="star">★★★★</span>
                        </label>
                        <label class="star-option">
                            <input type="radio" th:field="*{rating}" value="5"/>
                            <span class="star">★★★★★</span>
                        </label>
                    </div>
                    <div class="form-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}">评分错误</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="content">评价内容</label>
                    <textarea id="content" th:field="*{content}" class="form-textarea" rows="5"
                              placeholder="请输入10-200字的评价内容..." maxlength="200"></textarea>
                    <div class="form-hint">
                        <span>字数：<span id="charCount">0</span>/200</span>
                    </div>
                    <div class="form-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">评价内容错误</div>
                </div>

                <div class="form-actions">
                    <a th:href="@{'/items/' + ${item.id}}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">提交评价</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer class="app-footer">
    <span>© 2026 Campus Trade · 校园二手交易平台</span>
</footer>
<script>
    (function() {
        var textarea = document.getElementById('content');
        var charCount = document.getElementById('charCount');
        function updateCount() {
            charCount.textContent = textarea.value.length;
        }
        textarea.addEventListener('input', updateCount);
        updateCount();
    })();
</script>
</body>
</html>
