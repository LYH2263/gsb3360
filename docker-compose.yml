services:
  db:
    image: mysql:8.0
    container_name: campus-trade-db-3360
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_trade
      TZ: Asia/Shanghai
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - campus-net

  backend:
    build: ./backend
    container_name: campus-trade-backend-3360
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/campus_trade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8000:8000"
    networks:
      - campus-net

  frontend:
    image: nginx:alpine
    container_name: campus-trade-frontend-3360
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    networks:
      - campus-net

volumes:
  db_data:

networks:
  campus-net:
